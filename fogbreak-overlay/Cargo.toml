[package]
name = "fogbreak-solid"
description = "Fogbreak Solid Studio (browser WebGPU with WebGL2 fallback, page canvas host)"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[lints]
workspace = true

[[bin]]
name = "fogbreak-solid"
path = "src/main.rs"

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
solidcraft-doc = { workspace = true }
solidcraft-engine = { workspace = true }
solidcraft-io = { workspace = true }
solidcraft-theme = { workspace = true }
solidcraft-viewport = { workspace = true }
solidcraft-viewport-egui = { workspace = true }
solidcraft-viewport-gpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Location",
    "MediaQueryList",
    "Event",
    "EventTarget",
    "CustomEvent",
    "CustomEventInit",
] }
